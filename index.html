<!doctype html>
<html lang="id" class="notranslate">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5"
        />

        <!-- SEO / Open Graph ini jangan dihapus kocakkkk -->
        <meta property="og:title" content="Pesan Buatmu" />
        <meta property="og:description" content="pesan surat buatmu" />
        <meta
            property="og:image"
            content="https://cdn.ferdev.my.id/assets/img/surat.jpg"
        />
        <meta property="og:url" content="https://pesan.ferdev.my.id" />
        <meta property="og:type" content="website" />
        <meta name="author" content="Feri Pratama" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <title>Pesan Buatmu | by Feri</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&family=Zilla+Slab:ital,wght@1,300&family=Poppins:wght@700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>

        <!-- Stylesheets -->
        <link href="/assets/css/style.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <canvas id="snow-canvas"></canvas>
        <div id="bodyblur">
            <img src="/assets/image/background.jpg" alt="Background" />
        </div>
        <div id="Content">
            <!-- Surat / amplop -->
            <div id="suratin" onclick="memulai()">
                <img
                    src="https://media.tenor.com/dQI2ztOEsc8AAAAi/love-letter.gif"
                    alt="SuratBuatKamu"
                />
            </div>

            <!-- Keterangan awal -->
            <p id="ket">Ada Pesan Buatmu Nih Klik Surat Untuk Membukanya!</p>

            <!-- Foto akhir (muncul setelah surat dibuka) -->
            <div>
                <img
                    src="https://media.tenor.com/dLjx5LKQrPoAAAAi/mimibubu.gif"
                    alt="ImageAkhir"
                    id="fotoakhir"
                />
            </div>

            <!-- Pesan ketik -->
            <div>
                <blockquote id="bq">
                    <p id="kalimat"></p>
                    <p id="kalimatc"></p>
                </blockquote>
            </div>

            <!-- Tombol WhatsApp -->
            <div id="Tombol">
                <a>
                    <b class="material-icons love" onclick="pesane()"
                        >favorite</b
                    >
                </a>
            </div>
        </div>

        <!--Footer -->
        <div id="weem">
            <p>By Feri</p>
        </div>

        <script src="/assets/js/script.js"></script>
    </body>
</html>
